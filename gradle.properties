# Configuracion compartida del proyecto.
# Requiere JDK 17.0.17 o superior (target de compilacion = Java 17).
# No usar org.gradle.java.home con rutas locales: falla en otros equipos.
# Configura JAVA_HOME con un JDK 17+ (recomendado Temurin 17.0.17).

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.daemon=true