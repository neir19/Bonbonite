serenity {
  browser {
    maximized = true
  }
  webdriver {
    driver = chrome
    wait.for.timeout = 10000
    capabilities {
      browserName = "chrome"
      "goog:chromeOptions" {
        args = ["--start-maximized", "--disable-notifications", "--incognito"]
      }
    }
  }
}

